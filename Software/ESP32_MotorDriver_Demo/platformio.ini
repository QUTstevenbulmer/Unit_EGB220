; ESP32-S2 Motor Driver - demo & hardware test firmware
; Open this folder in VS Code with the PlatformIO extension, then press
; the "Upload" (->) button in the blue status bar.
;
; See README.md for the very first flash (needs the BOOT button once).

[platformio]
default_envs = motordriver

[env:motordriver]
platform = espressif32@^6.9.0
board = esp32s2_motordriver          ; custom board file in /boards
framework = arduino

; USB: the ESP32-S2 talks USB directly (no USB-serial chip on the board).
; "Serial" in the code is the USB CDC port.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall

; Libraries are downloaded automatically on the first build
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
